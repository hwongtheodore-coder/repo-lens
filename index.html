<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepoLens</title><style>body{font:16px system-ui;background:#101827;color:#e8edf5;max-width:800px;margin:8vh auto;padding:24px}h1{font-size:40px}p{color:#aab8ce}input,textarea,button{box-sizing:border-box;width:100%;padding:14px;border-radius:8px;border:1px solid #35445a;background:#18263a;color:white;margin:8px 0;font:inherit}button{background:#5b7cff;cursor:pointer;border:0}pre{white-space:pre-wrap;line-height:1.7}a{color:#9cb5ff}</style><h1>RepoLens</h1><p>输入公开 GitHub 仓库和你的问题，探索代码中的答案。</p><form id="form"><input id="url" placeholder="https://github.com/owner/repo" required><textarea id="question" placeholder="例如：项目的主要功能是什么？" required></textarea><button>开始分析</button></form><pre id="result"></pre><div id="files"></div><script>form.onsubmit=async e=>{e.preventDefault();result.textContent='正在分析，请稍候…';files.replaceChildren();try{const r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url.value,question:question.value})});const d=await r.json();if(d.error)throw Error(d.error);result.textContent=d.repo+'\n'+(d.description||'')+'\n\n'+d.answer+(d.truncated?'\n\n注意：GitHub 返回的文件列表不完整。':'');for(const f of d.files){const p=document.createElement('p'),a=document.createElement('a');a.href=f.url;a.textContent=f.path;a.target='_blank';a.rel='noopener noreferrer';p.append(a);files.append(p)}}catch(err){result.textContent='分析失败：'+err.message}};</script></html>
